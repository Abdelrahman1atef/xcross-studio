name: studio_ext
description: >-
  XCross Studio fork features for the xcross CLI: `xcross inspect`, device
  logs and an asset catalog compiler (`.xcassets` to `Assets.car`).
version: 0.1.0
publish_to: none
repository: https://github.com/Abdelrahman1atef/xcross-studio

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  apple_developer_kit: ^1.0.0 # studio: 019 — App Store Connect API
  archive: ^4.5.2
  args: ^2.7.0
  cli_kit: ^1.0.0
  crypto: ^3.0.8
  dart_mobile_device: ^1.0.0
  http: ^1.6.0 # studio: 019 — uploads to presigned URLs
  meta: ^1.19.0
  path: ^1.9.1
  propertylistserialization: ^1.5.0
  xml: ^7.1.0

dev_dependencies:
  test: ^1.33.0
