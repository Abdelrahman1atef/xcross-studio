# studio: 008/009 — XCross Studio desktop app: analyze + test on Windows and
# Linux, then build the portable package (GUI + CLI bundle) and, on Windows,
# the Inno Setup installer. Artifacts are uploaded for manual testing.
name: Studio GUI

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/studio/**"
      - "packages/**"
      - ".github/workflows/studio-gui.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-gui-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  gui:
    name: GUI (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: windows
            runner: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        # Cloned from the official repository (no third-party action).
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Linux desktop dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Resolve dependencies
        run: |
          flutter --version
          dart pub get
          (cd apps/studio && flutter pub get)

      - name: Analyze and test the GUI
        working-directory: apps/studio
        run: |
          flutter analyze
          flutter test

      - name: Package (CLI bundle + GUI)
        working-directory: apps/studio
        run: dart run tool/package.dart

      - name: Smoke-test the packaged CLI
        run: |
          exe=dist/xcross-studio-${{ matrix.os }}-x64/xcross/bin/xcross
          [ "${{ matrix.os }}" = windows ] && exe="$exe.exe"
          "$exe" --help | grep -E "devices|install|logs|inspect"

      - name: Installer (Inno Setup)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = "0.1.0-" + $env:GITHUB_SHA.Substring(0, 7)
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" apps/studio/installer/windows/xcross-studio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xcross-studio-${{ matrix.os }}-x64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14
