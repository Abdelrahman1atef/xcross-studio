# Reference only (provided 2026-11-03): the macOS + Codemagic CLI workflow that features 018/019
# reproduce on Windows/Linux with xcross. Client bundle ID and app name replaced by placeholders.
name: iOS App Store Release

# Builds a signed release IPA on a GitHub-hosted Mac and uploads it to App Store Connect (TestFlight).
# Signing is fully automatic: the App Store Connect API key registers the Bundle ID, creates the
# distribution certificate (reused every run via CERTIFICATE_PRIVATE_KEY) and the App Store profile.
#
# Required repository secrets:
#   APP_STORE_CONNECT_ISSUER_ID       Issuer ID from App Store Connect > Users and Access > Integrations
#   APP_STORE_CONNECT_KEY_IDENTIFIER  Key ID of a Team API key with the Admin role
#   APP_STORE_CONNECT_PRIVATE_KEY     Full contents of the AuthKey_<KEY_ID>.p8 file
#   CERTIFICATE_PRIVATE_KEY           RSA private key (PEM) used to create/reuse the distribution certificate
#   FIREBASE_OPTIONS_DART             Full contents of lib/firebase_options.dart (gitignored, holds the API keys)
# Optional repository variable:
#   APP_STORE_APP_ID                  Numeric Apple ID of the app, enables auto-incrementing build numbers

on:
  workflow_dispatch:

concurrency:
  group: ios-app-store-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload to App Store Connect
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.example.app
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write Firebase config and Maps key
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          set -euo pipefail
          printf '%s\n' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

          # The Firebase iOS key also serves Google Maps (restricted to the iOS bundle ID)
          IOS_API_KEY=$(sed -n '/static const FirebaseOptions ios/,/);/p' lib/firebase_options.dart \
            | grep -o -E 'AIza[0-9A-Za-z_-]{35}')
          echo "::add-mask::$IOS_API_KEY"
          echo "MAPS_API_KEY = $IOS_API_KEY" > ios/Flutter/Secrets.xcconfig

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Codemagic CLI tools
        run: pip install codemagic-cli-tools==0.70.0

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure Bundle ID and capabilities
        run: |
          set -euo pipefail

          BUNDLE_RESOURCE_ID=$(app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --platform IOS --json \
            | python3 -c 'import json,sys; ids=json.load(sys.stdin); print(ids[0]["id"] if ids else "")')

          if [ -z "$BUNDLE_RESOURCE_ID" ]; then
            BUNDLE_RESOURCE_ID=$(app-store-connect bundle-ids create "$BUNDLE_ID" \
              --name "App" --platform IOS --json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi

          # Must match the entitlements in ios/Runner/Runner.entitlements
          ENABLED=$(app-store-connect bundle-ids capabilities "$BUNDLE_RESOURCE_ID" --json)
          if ! echo "$ENABLED" | grep -q '"PUSH_NOTIFICATIONS"'; then
            app-store-connect bundle-ids enable-capabilities "$BUNDLE_RESOURCE_ID" --capability "Push Notifications"
          fi
          if ! echo "$ENABLED" | grep -q '"ASSOCIATED_DOMAINS"'; then
            app-store-connect bundle-ids enable-capabilities "$BUNDLE_RESOURCE_ID" --capability "Associated Domains"
          fi

      - name: Set up code signing
        run: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --delete-stale-profiles \
            --create
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Resolve build number
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')

          if [ -n "$APP_STORE_APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APP_ID" --platform IOS || true)
            if [[ "$LATEST" =~ ^[0-9]+$ ]] && [ $((LATEST + 1)) -gt "$BUILD_NUMBER" ]; then
              BUILD_NUMBER=$((LATEST + 1))
            fi
          fi

          echo "Using build number $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-${{ env.BUILD_NUMBER }}
          path: build/ios/ipa/*.ipa
          retention-days: 7

      - name: Upload to App Store Connect
        run: app-store-connect publish --path "build/ios/ipa/*.ipa"
